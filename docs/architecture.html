<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아키텍처 · 팀 아몰라 · Field Shift</title>
  <meta name="description" content="전체 시스템, 빌드 파이프라인, 서비스 파이프라인, 의사결정 모델, 협업 흐름.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  
  <link rel="stylesheet" href="./dashboard/styles.css">
  <link rel="stylesheet" href="./site/site.css">
</head>
<body class="explainer">
  <nav id="site-nav" class="site-nav" aria-label="주요 메뉴"></nav>
  <header class="page-header">
    <div class="wrap">
      <p class="kicker">Source of truth · ARCHITECTURE.md</p>
      <h1>아키텍처와 파이프라인</h1>
      <p class="lead">오프라인에서 데이터를 받아 미리 계산해 두는 <strong>빌드</strong>와, 핀을 찍으면 점수를 내고 설명하는 <strong>서비스</strong>를 나눕니다. 그림은 <code>docs/ARCHITECTURE.md</code>의 mermaid를 그대로 그립니다.</p>
    </div>
  </header>
  <main class="wrap">
    <p class="src-note">필드명·엔드포인트는 <a href="./data.html">SOT</a>가 이깁니다. 제품 범위는 <a href="./prd.html">PRD</a>. 라이브 경로는 MATLAB·Prithvi GPU·원본 다운로드를 돌리지 않습니다.</p>
    <div id="diagrams"><div class="empty">ARCHITECTURE.md를 불러오는 중…</div></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="./site/site.js"></script>

  <script>
    FieldShiftSite.mount({ active: "architecture" });

    const EXPLAIN = [
      {
        match: /전체 시스템/,
        html: "<p>농가와 현지 전문가는 로그인 없는 웹에서 핀을 찍습니다. 고지은·하지민의 프론트엔드가 Hylē의 FastAPI를 호출하고, Postgres 17(PostGIS·pgvector)이 1층 카운티 집계와 2층 Story 필지 피처를 돌려줍니다.</p><p>데이터는 VPS 오프라인 빌드(ETL, MATLAB 보정, Prithvi 추론, 근거 문서 크롤)로만 들어갑니다. LLM은 모델 API를 tool-call 해서 받은 숫자만 설명합니다. 중앙 제공자는 DeepSeek(OpenAI 호환)이고, 모델 id <code>deepseek-v4.1-flash</code>는 미검증입니다. MATLAB과 GPU 추론은 요청 경로에 없습니다.</p>"
      },
      {
        match: /빌드 파이프라인/,
        html: "<p>빌드(오프라인) 순서는 다운로드 → ETL(자르기·단위·CRS·집계) → Prithvi 작물 지도(추론만, 실패 시 CDL) → MATLAB 가뭄·NDVI 평활·아노말리 → Parquet/CSV를 PostGIS가 있는 Postgres에 적재입니다. 몬테카를로·백테스트·근거 문서 적재도 이 단계에서 미리 합니다.</p><p>1층은 콘벨트 12주를 카운티로만 받고, 30 m는 Story County만 받습니다. 원본은 <code>/data/raw</code>에 덮어쓰지 않습니다. 라이브 요청 경로에 MATLAB·GPU·원본 다운로드는 없습니다.</p>"
      },
      {
        match: /서비스 파이프라인/,
        html: "<p>서비스(런타임): 사용자가 필지(또는 카운티)를 고르면 FastAPI가 DB의 피처와 미리 넣어 둔 GEOS-S2S·NEX-GDDP 시나리오를 읽습니다. 몬테카를로 <strong>물수지</strong>의 사전 계산 결과에 CVaR와 7축 점수를 붙이고, 슬라이더로 가중만 바꿉니다.</p><p>LLM은 모델 API를 tool-call 해서 받은 숫자만 설명하고, RAG는 DOI 인용만 더합니다. 중앙 LLM 제공자는 <strong>DeepSeek</strong>(OpenAI 호환, <code>https://api.deepseek.com</code>)입니다. 모델 이름 <code>deepseek-v4.1-flash</code>는 <strong>미검증</strong>이며, 베이스 URL과 모델은 설정으로 바꿉니다. 결과는 전략 카드·지도·복셀 시뮬로 갑니다. 카운티 수량(수확량)은 <strong>선택 옆축</strong>이며 물수지 MC의 필수 출력이 아닙니다. 한 요청 안에서 MATLAB이나 원본 다운로드는 하지 않습니다.</p>"
      },
      {
        match: /의사결정 모델/,
        html: "<p>돕는 결정은 “기존 옥수수–대두 윤작에 무엇을 추가·변경하면 토양 건강과 날씨·물 회복력이 좋아질까”입니다. 관측(POWER·IMERG·SMAP·HLS·CDL·CSB·SSURGO)과 시나리오(GEOS-S2S, NEX-GDDP), 농가 슬라이더가 7축 지수로 들어갑니다.</p><p>전략 A–D를 나란히 비교하고, 순위는 슬라이더 가중으로만 바뀌며 원점수와 분포는 유지됩니다. 단일 정답은 없고, 맨땅·취약 계절·P10/P50/P90·CVaR·근거·공백·현장 위험을 함께 보여 줍니다. 유기물·질소의 확정 kg은 자동 수치화하지 않습니다.</p>"
      },
      {
        match: /agent-loop|오케스트레이터/,
        html: "<p>VPS의 Mattermost와 orchestrator 봇이 1:1 채널에 <code>!task #이슈</code>를 보냅니다. 각 노트북의 agent-loop가 그 채널을 기본 <strong>약 4초마다</strong> 폴링합니다(코드 <code>POLL_SEC=4</code>, README 도식은 5초). <code>!task</code>를 보면 Codex 또는 agy를 실행합니다.</p><p>끝나면 PR(<code>Closes #N</code>)과 이슈 <code>STATUS:</code> 댓글을 남깁니다. 중앙 check-in(heartbeat)은 기본 <strong>3분마다</strong> 한 글을 고쳐 씁니다(<code>HEARTBEAT_MIN=3</code>, README는 3–5분 권장). 봇은 10분(<code>AGENT_SILENT_MIN</code>) 넘게 소식이 없으면 경고합니다. 머지는 Hylē만 합니다. MATLAB 담당에게는 <code>!task</code>를 자동 배정하지 않지만, 설치와 check-in은 합니다. 오케스트레이터 중앙 LLM은 <strong>DeepSeek</strong>(OpenAI 호환, 베이스 URL <code>https://api.deepseek.com</code>)입니다. 모델은 <code>ORCH_MODEL</code>로 바꾸며, 지금은 <code>deepseek-v4.1-flash</code>를 쓰되 <strong>정확한 id는 미검증</strong>입니다. 원문: <a href=\"https://github.com/cloudsnuchoi/2026NASA/blob/main/infra/agent-loop/README.md\">infra/agent-loop/README.md</a>, <a href=\"https://github.com/cloudsnuchoi/2026NASA/blob/main/infra/orchestrator/README.md\">infra/orchestrator/README.md</a>.</p>"
      },
      {
        match: /협업|워크플로/,
        html: "<p>팀원 전원 깃 초보이므로 Codex CLI / agy CLI가 브랜치·커밋·PR을 대행하고, 머지는 Hylē만 합니다. main은 PR로만 바뀝니다. MATLAB 두 분은 git을 쓰지 않고 결과 파일을 VPS에 둡니다.</p><p>Mattermost 공개 채널과 팀원별 1:1 방(팀원 + Hylē + 오케스트레이터 봇)이 있습니다. 봇 또는 Hylē가 <code>!task</code>를 쓰면, 각 노트북의 <strong>agent-loop</strong>가 채널을 기본 약 4초마다 폴링해 Codex/agy를 실행하고 PR과 STATUS를 남깁니다. 작업 채널 폴링과 check-in은 다릅니다: 폴링은 <code>POLL_SEC=4</code>(약 4–5초), check-in은 기본 3분(<code>HEARTBEAT_MIN=3</code>, 3–5분 권장)입니다. 10분 침묵이면 봇이 경고합니다. 오케스트레이터 봇의 중앙 LLM은 DeepSeek(OpenAI 호환)이며, 베이스 URL과 모델은 <code>OPENAI_BASE_URL</code>·<code>ORCH_MODEL</code>로 바꿉니다. 모델 id <code>deepseek-v4.1-flash</code>는 미검증입니다. 머지는 Hylē만, 상태의 원본은 GitHub입니다.</p>"
      }
    ];

    let cachedBlocks = [];

    function explainFor(title) {
      for (let i = 0; i < EXPLAIN.length; i++) {
        if (EXPLAIN[i].match.test(title)) return EXPLAIN[i].html;
      }
      return "<p>이 그림의 설명은 ARCHITECTURE.md 해당 절을 따릅니다.</p>";
    }

    async function drawAll() {
      const host = document.getElementById("diagrams");
      if (!cachedBlocks.length) {
        host.innerHTML = '<div class="md-error">ARCHITECTURE.md에서 mermaid 블록을 찾지 못했습니다. <a href="https://github.com/cloudsnuchoi/2026NASA/blob/main/docs/ARCHITECTURE.md">GitHub에서 보기</a></div>';
        return;
      }
      host.innerHTML = "";
      for (let i = 0; i < cachedBlocks.length; i++) {
        const b = cachedBlocks[i];
        const wrap = document.createElement("section");
        wrap.className = "diagram-block";
        wrap.id = "diagram-" + (i + 1);
        const h = document.createElement("h2");
        h.textContent = b.title.replace(/^[\d.]+\s*/, "");
        const box = document.createElement("div");
        box.className = "mermaid-box tall";
        box.id = "mmd-box-" + i;
        box.innerHTML = '<div class="empty">그리는 중…</div>';
        const exp = document.createElement("div");
        exp.className = "diagram-explain";
        exp.innerHTML = explainFor(b.title);
        wrap.appendChild(h);
        if (i === 0) {
          const hint = document.createElement("p");
          hint.className = "muted";
          hint.textContent = "그림이 세로로 깁니다. 먼저 1층(콘벨트 카운티)과 2층(Story 필지), 협업이 보이고, 아래로 스크롤하면 사용자·프론트엔드·API·DB·오프라인 빌드가 나옵니다.";
          wrap.appendChild(hint);
        }
        wrap.appendChild(box);
        wrap.appendChild(exp);
        host.appendChild(wrap);
        await FieldShiftSite.renderMermaidInto(box, b.code, "arch" + i);
      }
    }

    (async function () {
      const host = document.getElementById("diagrams");
      try {
        const md = await FieldShiftSite.fetchFirst(FieldShiftSite.docsUrls("ARCHITECTURE.md"));
        cachedBlocks = FieldShiftSite.extractMermaid(md).filter(function (b) {
          return /전체 시스템|빌드 파이프라인|서비스 파이프라인|의사결정 모델|협업|agent-loop|오케스트레이터/.test(b.title);
        });
        if (!cachedBlocks.length) cachedBlocks = FieldShiftSite.extractMermaid(md);
        await drawAll();
      } catch (e) {
        host.innerHTML = '<div class="md-error">ARCHITECTURE.md를 불러오지 못했습니다. <a href="https://github.com/cloudsnuchoi/2026NASA/blob/main/docs/ARCHITECTURE.md">GitHub에서 보기</a> (' +
          FieldShiftSite.escapeHtml(String(e.message || e)) + ")</div>";
      }
    })();

    window.addEventListener("fieldshift:theme", function () { if (cachedBlocks.length) drawAll(); });
  </script>
</body>
</html>
