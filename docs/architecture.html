<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아키텍처 · ART FARM · Field Shift</title>
  <meta name="description" content="구현된 파이프라인: 핀 → 사전 계산 DB → Prithvi → GEOS-S2S/NEX 시나리오 → MC 물수지 → API → LLM 설명. Tier 1 /quick vs Tier 2 20필지.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  
  <link rel="stylesheet" href="./dashboard/styles.css">
  <link rel="stylesheet" href="./site/site.css">
</head>
<body class="explainer">
  <nav id="site-nav" class="site-nav" aria-label="주요 메뉴"></nav>
  <header class="page-header">
    <div class="wrap">
      <p class="kicker">구현 상태 · 2026-11-15 KST</p>
      <h1>아키텍처와 파이프라인</h1>
      <p class="lead">오프라인에서 데이터를 받아 미리 계산해 두는 <strong>빌드</strong>와, 다각형을 찍으면 계산하고 설명하는 <strong>서비스</strong>를 나눕니다. 위 두 그림은 지금 동작하는 구현이고, 아래 협업 그림은 <code>docs/ARCHITECTURE.md</code>에서 읽습니다.</p>
    </div>
  </header>
  <main class="wrap">
    <p class="src-note">필드명·엔드포인트는 <a href="./data.html">SOT</a>가 이깁니다. 제품 범위는 <a href="./prd.html">PRD</a>. 라이브 경로는 MATLAB·Prithvi 추론·원본 다운로드를 돌리지 않습니다.</p>
    <div id="diagrams"><div class="empty">ARCHITECTURE.md를 불러오는 중…</div></div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="./site/site.js"></script>

  <script>
    FieldShiftSite.mount({ active: "architecture" });

    const EXPLAIN = [
      {
        match: /전체 시스템/,
        html: "<p>농가와 현지 전문가는 로그인 없는 웹에서 핀을 찍습니다. 고지은·하지민의 프론트엔드가 Hylē의 FastAPI를 호출하고, Postgres 17(PostGIS·pgvector)이 1층 카운티 집계와 2층 Story 필지 피처를 돌려줍니다.</p><p>데이터는 VPS 오프라인 빌드(ETL, MATLAB 보정, Prithvi 추론, 근거 문서 크롤)로만 들어갑니다. LLM은 모델 API를 tool-call 해서 받은 숫자만 설명합니다. 중앙 제공자는 DeepSeek(OpenAI 호환)이고, 모델 id는 <code>deepseek-flash</code>(DeepSeek-V4.1-Flash, 공식 문서 2026-11-15 확인)입니다. MATLAB과 GPU 추론은 요청 경로에 없습니다.</p>"
      },
      {
        match: /빌드 파이프라인/,
        html: "<p>빌드(오프라인) 순서는 다운로드 → ETL(자르기·단위·CRS·집계) → Prithvi 작물 지도(추론만, 실패 시 CDL) → MATLAB 가뭄·NDVI 평활·아노말리 → Parquet/CSV를 PostGIS가 있는 Postgres에 적재입니다. 몬테카를로·백테스트·근거 문서 적재도 이 단계에서 미리 합니다.</p><p>1층은 콘벨트 12주를 카운티로만 받고, 30 m는 Story County만 받습니다. 원본은 <code>/data/raw</code>에 덮어쓰지 않습니다. 라이브 요청 경로에 MATLAB·GPU·원본 다운로드는 없습니다.</p>"
      },
      {
        match: /서비스 파이프라인/,
        html: "<p>서비스(런타임): 사용자가 필지(또는 카운티)를 고르면 FastAPI가 DB의 피처와 미리 넣어 둔 GEOS-S2S·NEX-GDDP 시나리오를 읽습니다. 몬테카를로 <strong>물수지</strong>의 사전 계산 결과에 CVaR와 7축 점수를 붙이고, 슬라이더로 가중만 바꿉니다.</p><p>LLM은 모델 API를 tool-call 해서 받은 숫자만 설명하고, RAG는 DOI 인용만 더합니다. 중앙 LLM 제공자는 <strong>DeepSeek</strong>(OpenAI 호환, <code>https://api.deepseek.com</code>)입니다. 모델 id는 <code>deepseek-flash</code>(DeepSeek-V4.1-Flash, 공식 문서 2026-11-15 확인)이며, 베이스 URL과 모델은 설정으로 바꿉니다. 결과는 전략 카드·지도·복셀 시뮬로 갑니다. 카운티 수량(수확량)은 <strong>선택 옆축</strong>이며 물수지 MC의 필수 출력이 아닙니다. 한 요청 안에서 MATLAB이나 원본 다운로드는 하지 않습니다.</p>"
      },
      {
        match: /의사결정 모델/,
        html: "<p>돕는 결정은 “기존 옥수수–대두 윤작에 무엇을 추가·변경하면 토양 건강과 날씨·물 회복력이 좋아질까”입니다. 관측(POWER·IMERG·SMAP·HLS·CDL·CSB·SSURGO)과 시나리오(GEOS-S2S, NEX-GDDP), 농가 슬라이더가 7축 지수로 들어갑니다.</p><p>전략 A–D를 나란히 비교하고, 순위는 슬라이더 가중으로만 바뀌며 원점수와 분포는 유지됩니다. 단일 정답은 없고, 맨땅·취약 계절·P10/P50/P90·CVaR·근거·공백·현장 위험을 함께 보여 줍니다. 유기물·질소의 확정 kg은 자동 수치화하지 않습니다.</p>"
      },
      {
        match: /agent-loop|오케스트레이터/,
        html: "<p>VPS의 Mattermost와 orchestrator 봇이 1:1 채널에 <code>!task #이슈</code>를 보냅니다. 각 노트북의 agent-loop가 그 채널을 기본 <strong>약 4초마다</strong> 폴링합니다(코드 <code>POLL_SEC=4</code>, README 도식은 5초). <code>!task</code>를 보면 Codex 또는 agy를 실행합니다.</p><p>끝나면 PR(<code>Closes #N</code>)과 이슈 <code>STATUS:</code> 댓글을 남깁니다. 중앙 check-in(heartbeat)은 기본 <strong>3분마다</strong> 한 글을 고쳐 씁니다(<code>HEARTBEAT_MIN=3</code>, README는 3–5분 권장). 봇은 10분(<code>AGENT_SILENT_MIN</code>) 넘게 소식이 없으면 경고합니다. 머지는 Hylē만 합니다. MATLAB 담당에게는 <code>!task</code>를 자동 배정하지 않지만, 설치와 check-in은 합니다. 오케스트레이터 중앙 LLM은 <strong>DeepSeek</strong>(OpenAI 호환, 베이스 URL <code>https://api.deepseek.com</code>)입니다. 모델은 <code>LLM_MODEL</code>로 바꾸며, 지금은 <code>deepseek-flash</code>(DeepSeek-V4.1-Flash, 공식 문서 2026-11-15 확인)을 씁니다. 원문: <a href=\"https://github.com/cloudsnuchoi/2026NASA/blob/main/infra/agent-loop/README.md\">infra/agent-loop/README.md</a>, <a href=\"https://github.com/cloudsnuchoi/2026NASA/blob/main/infra/orchestrator/README.md\">infra/orchestrator/README.md</a>.</p>"
      },
      {
        match: /협업|워크플로/,
        html: "<p>팀원 전원 깃 초보이므로 Codex CLI / agy CLI가 브랜치·커밋·PR을 대행하고, 머지는 Hylē만 합니다. main은 PR로만 바뀝니다. MATLAB 두 분은 git을 쓰지 않고 결과 파일을 VPS에 둡니다.</p><p>Mattermost 공개 채널과 팀원별 1:1 방(팀원 + Hylē + 오케스트레이터 봇)이 있습니다. 봇 또는 Hylē가 <code>!task</code>를 쓰면, 각 노트북의 <strong>agent-loop</strong>가 채널을 기본 약 4초마다 폴링해 Codex/agy를 실행하고 PR과 STATUS를 남깁니다. 작업 채널 폴링과 check-in은 다릅니다: 폴링은 <code>POLL_SEC=4</code>(약 4–5초), check-in은 기본 3분(<code>HEARTBEAT_MIN=3</code>, 3–5분 권장)입니다. 10분 침묵이면 봇이 경고합니다. 오케스트레이터 봇의 중앙 LLM은 DeepSeek(OpenAI 호환)이며, 베이스 URL과 모델은 <code>LLM_BASE_URL</code>·<code>LLM_MODEL</code>로 바꿉니다. 모델 id는 <code>deepseek-flash</code>(DeepSeek-V4.1-Flash, 공식 문서 2026-11-15 확인)입니다. 머지는 Hylē만, 상태의 원본은 GitHub입니다.</p>"
      }
    ];


    const IMPL = [
      {
        title: "서비스 파이프라인 (구현됨): Tier 1 /quick vs Tier 2 20필지",
        code: [
          "flowchart TB",
          "  U[\"농가·현지 전문가<br/>지도에서 네 꼭짓점 핀 + 작물 2–3개\"] --> FE[\"ART FARM 프론트엔드<br/>로그인 없음\"]",
          "  FE -->|모든 다각형| T1[\"Tier 1 · POST /quick<br/>FAO-56 엔진 (팀 MATLAB V8 이식)<br/>NASA POWER 10년 · USGS 3DEP · NWS · Open-Meteo\"]",
          "  T1 --> C1[\"screening estimate 카드<br/>순위 없음\"]",
          "  FE -->|데모 필지 20개와 겹침| DB",
          "  subgraph T2[\"Tier 2 · Deep Analysis (4개 카운티 20필지)\"]",
          "    DB[(\"사전 계산 DB<br/>Postgres + PostGIS<br/>CSB · CDL · SSURGO · POWER · HLS · OpenET\")] --> PR[\"Prithvi 작물 확인<br/>vision_result (오프라인 추론 결과)\"]",
          "    PR --> SC[\"시나리오 분포<br/>GEOS-S2S 다음 시즌 · NEX-GDDP 2030년대\"]",
          "    SC --> MC[\"몬테카를로 물수지<br/>500회 · P10/P50/P90 · CVaR · 2012 백테스트\"]",
          "    MC --> API[\"model_api (FastAPI)<br/>/simulate · /strategies/compare · /validation/backtest\"]",
          "    API --> LLM[\"POST /explain<br/>DeepSeek deepseek-flash<br/>tool JSON 숫자만\"]",
          "  end",
          "  API --> C2[\"전략 카드 A–D<br/>기준 A 대비 상대 지수\"]",
          "  LLM --> C2",
          "  FE -->|20필지 밖| OUT[\"Deep analysis available in 4 pilot counties\"]"
        ].join("\n"),
        html: "<p><strong>Tier 1</strong>은 콘벨트 어디서나 동작합니다. <code>POST /quick</code>이 NASA POWER 10년 일 기상, USGS 3DEP 고도, NWS·Open-Meteo 맥락을 받아 FAO-56 식(팀 MATLAB V8을 Python으로 옮김)으로 <strong>screening estimate</strong>를 내고, 순위는 없습니다.</p><p><strong>Tier 2</strong>는 다각형이 데모 필지 20개(Story IA 12, McLean IL 3, Lancaster NE 3, Union OH 2)와 겹칠 때만 돕니다. 미리 적재한 DB → Prithvi 작물 확인(오프라인 추론 결과 조회) → GEOS-S2S·NEX-GDDP 시나리오 분포 → 몬테카를로 물수지(500회, 시드 고정, CVaR 하위 10 %, 2012 백테스트) → API → LLM 설명 순서입니다. LLM은 tool JSON 숫자만 씁니다. 근거 인용 색인(<code>evidence_chunk</code>)은 0행이라 <code>/evidence/search</code>는 <code>insufficient_evidence: true</code>를 돌려줍니다(대체 경로). Prithvi: 2024년 기준 Prithvi 필지 최빈 클래스가 USDA CDL 작물과 같은 필지는 20개 중 19개이고, 필지별 CDL 픽셀 일치율은 0.193–0.997(중앙값 0.934, 평균 0.883)이다. 대부분 옥수수·콩 단작 필지라 일반 정확도가 아니다(모델 카드 aAcc 60.64 %).</p>"
      },
      {
        title: "빌드 파이프라인 (오프라인, 구현됨)",
        code: [
          "flowchart LR",
          "  subgraph N[\"NASA 자료\"]",
          "    P1[\"POWER\"]",
          "    P2[\"HLS v2.0\"]",
          "    P3[\"GPM IMERG · NLDAS-2 · SMAP\"]",
          "    P4[\"GEOS-S2S-3 · NEX-GDDP-CMIP6\"]",
          "  end",
          "  subgraph O[\"기타 자료\"]",
          "    O1[\"USDA CDL · CSB · NASS\"]",
          "    O2[\"SSURGO · OpenET · Census\"]",
          "  end",
          "  N --> ETL[\"data_pipeline ETL<br/>자르기 · 단위 · EPSG:4326 저장\"]",
          "  O --> ETL",
          "  ETL --> DB[(\"Postgres + PostGIS\")]",
          "  P2 --> PRI[\"Prithvi-EO-1.0 추론<br/>CPU 배치, 미세조정 없음\"]",
          "  PRI --> DB",
          "  DB --> MAT[\"MATLAB 빌드 단계 검증(오프라인)<br/>그림 · CSV, DB에 쓰지 않음\"]"
        ].join("\n"),
        html: "<p>원본 다운로드·ETL·Prithvi 추론은 모두 요청 경로 밖에서 미리 합니다. MATLAB은 <strong>빌드 단계 검증(오프라인)</strong>입니다: API·DB 스냅숏을 읽어 그림과 CSV를 만들고 DB에 쓰지 않습니다. 결과: <a href=\"./matlab-results/\">matlab-results/</a>, 한계: <a href=\"https://github.com/cloudsnuchoi/2026NASA/blob/main/docs/MATLAB-VALIDATION.md\">MATLAB-VALIDATION.md</a>. 출처 전체 목록: <a href=\"https://github.com/cloudsnuchoi/2026NASA/blob/main/docs/DATA_SOURCES.md\">DATA_SOURCES.md</a>.</p>"
      }
    ];

    let cachedBlocks = [];

    function explainFor(title) {
      for (let i = 0; i < EXPLAIN.length; i++) {
        if (EXPLAIN[i].match.test(title)) return EXPLAIN[i].html;
      }
      return "<p>이 그림의 설명은 ARCHITECTURE.md 해당 절을 따릅니다.</p>";
    }

    async function drawAll() {
      const host = document.getElementById("diagrams");
      host.innerHTML = "";
      const all = IMPL.concat(cachedBlocks);
      for (let i = 0; i < all.length; i++) {
        const b = all[i];
        const wrap = document.createElement("section");
        wrap.className = "diagram-block";
        wrap.id = "diagram-" + (i + 1);
        const h = document.createElement("h2");
        h.textContent = b.title.replace(/^[\d.]+\s*/, "");
        const box = document.createElement("div");
        box.className = "mermaid-box tall";
        box.id = "mmd-box-" + i;
        box.innerHTML = '<div class="empty">그리는 중…</div>';
        const exp = document.createElement("div");
        exp.className = "diagram-explain";
        exp.innerHTML = b.html || explainFor(b.title);
        wrap.appendChild(h);
        wrap.appendChild(box);
        wrap.appendChild(exp);
        host.appendChild(wrap);
        await FieldShiftSite.renderMermaidInto(box, b.code, "arch" + i);
      }
    }

    (async function () {
      const host = document.getElementById("diagrams");
      try {
        const md = await FieldShiftSite.fetchFirst(FieldShiftSite.docsUrls("ARCHITECTURE.md"));
        cachedBlocks = FieldShiftSite.extractMermaid(md).filter(function (b) {
          return /협업|agent-loop|오케스트레이터/.test(b.title);
        });
      } catch (e) {
        cachedBlocks = [];
      }
      await drawAll();
    })();

    window.addEventListener("fieldshift:theme", function () { drawAll(); });
  </script>
</body>
</html>
